name: Cloudflare Preview

# Builds the site for a pull request and puts it behind Cloudflare Access at
# pr-<number>.preview.alanizcreative.com, so a change can be looked at before
# it is published.
#
# Pull requests opened by the content app fire this workflow. Workflows are not
# re-triggered by events created with the Actions GITHUB_TOKEN — a loop guard —
# but a GitHub App installation token is exempt from it. Opening these pull
# requests any other way would leave the preview silently never running.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Named so the content worker can find this check and tell an editor whether
  # the preview is ready yet
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v5

      # Install PNPM
      - name: Install PNPM
        uses: pnpm/action-setup@v5

      # Set up Node.js for PNPM
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      # Install PNPM dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --optional

      # Build the site, which also validates the content files
      - name: Build site
        run: pnpm build
        env:
          ENVIRONMENT: staging

      # Deploy a worker of its own for this pull request
      - name: Deploy preview
        run: |
          pnpm exec wrangler deploy \
            --config wrangler.preview.json \
            --name alaniz-creative-pr-${{ github.event.pull_request.number }} \
            --route "pr-${{ github.event.pull_request.number }}.preview.alanizcreative.com/*"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # Say where it is
      - name: Summarise
        run: |
          echo "Preview: https://pr-${{ github.event.pull_request.number }}.preview.alanizcreative.com" >> $GITHUB_STEP_SUMMARY

  # Every staged change that is never published would otherwise leave a branch,
  # a pull request and a running worker behind
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Install PNPM
      - name: Install PNPM
        uses: pnpm/action-setup@v5

      # Set up Node.js for PNPM
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Remove the worker this pull request was previewed on
      - name: Delete preview
        run: |
          pnpm dlx wrangler@4 delete \
            --name alaniz-creative-pr-${{ github.event.pull_request.number }} \
            --force || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
